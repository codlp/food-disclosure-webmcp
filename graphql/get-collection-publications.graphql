query CollectionPublications($identifier: CollectionIdentifierInput!) {
  collection: collectionByIdentifier(identifier: $identifier) {
    handle
    title
    resourcePublications(first: 20) {
      nodes {
        isPublished
        publication {
          name
          catalog {
            title
          }
        }
      }
    }
    unpublishedPublications(first: 20) {
      nodes {
        name
        catalog {
          title
        }
      }
    }
  }
}
