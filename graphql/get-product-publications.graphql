query ProductPublications($identifier: ProductIdentifierInput!) {
  product: productByIdentifier(identifier: $identifier) {
    id
    handle
    resourcePublications(first: 20) {
      nodes {
        isPublished
        publication {
          id
          name
          catalog {
            title
          }
        }
      }
    }
    unpublishedPublications(first: 20) {
      nodes {
        id
        name
        catalog {
          title
        }
      }
    }
  }
}
